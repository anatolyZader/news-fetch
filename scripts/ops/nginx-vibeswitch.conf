# Reverse proxy: TLS on nginx → Node on 127.0.0.1:3000
# Deploy: sudo cp scripts/ops/nginx-vibeswitch.conf /etc/nginx/sites-available/vibeswitch
#         sudo nginx -t && sudo systemctl reload nginx
#
# App env (required): TRUST_PROXY=true, ENABLE_HSTS=true, NODE_ENV=production

server {
    listen 80;
    server_name vibeswitch.ai www.vibeswitch.ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name vibeswitch.ai www.vibeswitch.ai;

    ssl_certificate     /etc/letsencrypt/live/vibeswitch.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vibeswitch.ai/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection keep-alive;
        proxy_cache_bypass $http_upgrade;

        # SSE — disable buffering so events reach the browser immediately
        proxy_buffering    off;
        proxy_read_timeout 300s;
        client_max_body_size 100m;
    }
}
