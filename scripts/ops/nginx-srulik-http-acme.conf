# Temporary HTTP-only config for initial Let's Encrypt issuance (before SSL paths exist).
# Replace with nginx-srulik.conf + nginx-srulik-subdomains.conf after certbot succeeds.
#
#   sudo cp scripts/ops/nginx-srulik-http-acme.conf /etc/nginx/sites-available/srulik
#   sudo ln -sf /etc/nginx/sites-available/srulik /etc/nginx/sites-enabled/srulik
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot certonly --webroot -w /var/www/certbot \
#     -d srulik.ai -d www.srulik.ai -d docs.srulik.ai -d analyst.srulik.ai \
#     --non-interactive --agree-tos -m security@srulik.ai

server {
    listen 80;
    server_name srulik.ai www.srulik.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 300s;
        client_max_body_size 100m;
    }
}

server {
    listen 80;
    server_name docs.srulik.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        root /home/eventstorm1/news/tools/docs-site/build;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name analyst.srulik.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        root /home/eventstorm1/news/analyst-site/dist;
        try_files $uri $uri/ /index.html;
    }
}
