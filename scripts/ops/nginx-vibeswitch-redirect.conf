# 301 redirect legacy vibeswitch.ai → srulik.ai (after srulik.ai is live)
# Deploy: sudo cp scripts/ops/nginx-vibeswitch-redirect.conf /etc/nginx/sites-available/vibeswitch-redirect
#         sudo rm -f /etc/nginx/sites-enabled/vibeswitch
#         sudo ln -sf /etc/nginx/sites-available/vibeswitch-redirect /etc/nginx/sites-enabled/vibeswitch-redirect
#         sudo nginx -t && sudo systemctl reload nginx
#
# Keep existing Let's Encrypt cert for vibeswitch.ai on the VM (used for Full strict origin).

server {
    listen 80;
    server_name vibeswitch.ai www.vibeswitch.ai;
    return 301 https://srulik.ai$request_uri;
}

server {
    listen 443 ssl http2;
    server_name vibeswitch.ai www.vibeswitch.ai;

    ssl_certificate     /etc/letsencrypt/live/vibeswitch.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vibeswitch.ai/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://srulik.ai$request_uri;
}
