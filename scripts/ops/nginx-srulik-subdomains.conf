# Static subdomains: docs (Docusaurus)
# Deploy after main srulik cert exists (same cert path as apex).
#   sudo cp scripts/ops/nginx-srulik-subdomains.conf /etc/nginx/sites-available/srulik-subdomains
#   sudo ln -sf /etc/nginx/sites-available/srulik-subdomains /etc/nginx/sites-enabled/srulik-subdomains
#   sudo nginx -t && sudo systemctl reload nginx
#
# Cert: include -d docs.srulik.ai with apex certbot run.

server {
    listen 80;
    server_name docs.srulik.ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name docs.srulik.ai;

    ssl_certificate     /etc/letsencrypt/live/srulik.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/srulik.ai/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /home/eventstorm1/news/tools/docs-site/build;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
