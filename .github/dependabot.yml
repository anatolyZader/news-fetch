# Dependabot: grouped weekly updates for npm lockfiles and GitHub Actions.
# See docs/DEPENDENCIES.md and SECURITY.md for review policy and min-release-age in CI.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      root-production:
        dependency-type: production
        patterns:
          - "*"
      root-development:
        dependency-type: development
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      client:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /analyst-site
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      analyst-site:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /docs/docs-site
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      docs-site:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
