name: docs

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Docs quality gate
        run: npm run docs:check

