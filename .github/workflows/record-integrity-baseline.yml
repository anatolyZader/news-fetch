name: Record integrity baseline

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  record:
    name: Record integrity baseline (CI build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Resolve min-release-age policy
        id: release_age
        run: bash .github/scripts/resolve-min-release-age.sh

      - uses: ./.github/actions/setup-npm-ci
        with:
          working-directory: client
          min-release-age-days: ${{ steps.release_age.outputs.days }}

      - run: npm run client:build

      - run: npm run security:integrity:record

      - name: Upload integrity baseline
        uses: actions/upload-artifact@v4
        with:
          name: integrity-baseline
          path: cross-cut-modules/security/data/integrity-baseline.json
          retention-days: 7
