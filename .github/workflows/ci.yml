name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Explicit permissions: if only `contents: write` is set, GITHUB_TOKEN cannot
# register commit/PR status checks — branch protection will show "No checks".
permissions:
  contents: write
  checks: write
  statuses: write
  pull-requests: write

jobs:
  sync-main-docs:
    name: Sync main documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix docs-site

      - name: Regenerate main_docu_files and API docs
        run: npm run docs:sync

      - name: Validate product_docs
        run: npm run docs:check

      - name: Commit documentation updates (PR branches only)
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git add docs/main_docu_files product_docs/api/generated
          if git diff --staged --quiet; then
            echo "Main documentation already up to date."
            exit 0
          fi
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "::error::Documentation drift after docs:sync. On protected branches, commit locally:"
            echo "  npm run docs:sync && git add docs/main_docu_files product_docs/api/generated && git commit"
            git diff --staged --stat
            exit 1
          fi
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "::warning::Cannot push doc sync to fork PR; run npm run docs:sync locally."
            git diff --staged --stat
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: sync main_docu_files from code [skip ci]"
          git push origin HEAD:"${BRANCH}"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - name: Verify Node built-in sqlite (node:sqlite)
        run: node -e "import('node:sqlite').then(()=>console.log('node:sqlite OK')).catch(e=>{console.error(e);process.exit(1)})"
      - name: Check NORTH_TERMS synced with north-reference
        run: |
          OUT=$(node scripts/sync-north-terms-from-reference.mjs)
          echo "$OUT"
          node -e "const j=JSON.parse(process.argv[1]); if(j.new_count>0){console.error('Run: npm run sync:north-terms -- --write'); process.exit(1)}" "$OUT"
      - run: npm test
        env:
          GEO_ASSERT_ENVELOPE: '1'

  build-client:
    name: Build client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - run: npm ci --prefix client
      - run: npm run client:build

  build-docs-site:
    name: Build docs site
    runs-on: ubuntu-latest
    needs: sync-main-docs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci --prefix docs-site
      - run: npm run gen:api --prefix docs-site
      - run: npm run build --prefix docs-site

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: node scripts/ci-audit.mjs

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Detect SonarCloud configuration
        id: gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "${SONAR_TOKEN}" ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "run=0" >> "$GITHUB_OUTPUT"
            echo "::notice::SONAR_TOKEN is not set; skipping SonarCloud analysis."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == '1'
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        if: steps.gate.outputs.run == '1'
        uses: SonarSource/sonarcloud-github-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
