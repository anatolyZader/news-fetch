name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      skip_release_age:
        description: Skip min-release-age check (emergency CVE fix only)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Status checks need checks + statuses write; only sync-main-docs needs contents write.
permissions:
  contents: read
  checks: write
  statuses: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Resolve min-release-age policy
        id: release_age
        env:
          INPUT_SKIP_RELEASE_AGE: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_release_age || 'false' }}
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: bash .github/scripts/resolve-min-release-age.sh

      - run: npm run check:engines

      - uses: ./.github/actions/setup-npm-ci
        with:
          min-release-age-days: ${{ steps.release_age.outputs.days }}

      - run: npm run openapi:lint

  sync-main-docs:
    name: Sync main documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Resolve min-release-age policy
        id: release_age
        env:
          INPUT_SKIP_RELEASE_AGE: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_release_age || 'false' }}
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: bash .github/scripts/resolve-min-release-age.sh

      - name: Install dependencies
        uses: ./.github/actions/setup-npm-ci
        with:
          min-release-age-days: ${{ steps.release_age.outputs.days }}

      - uses: ./.github/actions/setup-npm-ci
        with:
          working-directory: docs-site
          min-release-age-days: ${{ steps.release_age.outputs.days }}

      - name: Regenerate main_docu_files and API docs
        run: npm run docs:sync

      - name: Validate product_docs
        run: npm run docs:check

      - name: Commit documentation updates (PR branches only)
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git add docs/main_docu_files product_docs/api/generated
          if git diff --staged --quiet; then
            echo "Main documentation already up to date."
            exit 0
          fi
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "::error::Documentation drift after docs:sync. On protected branches, commit locally:"
            echo "  npm run docs:sync && git add docs/main_docu_files product_docs/api/generated && git commit"
            git diff --staged --stat
            exit 1
          fi
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "::warning::Cannot push doc sync to fork PR; run npm run docs:sync locally."
            git diff --staged --stat
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: sync main_docu_files from code [skip ci]"
          git push origin HEAD:"${BRANCH}"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Resolve min-release-age policy
        id: release_age
        env:
          INPUT_SKIP_RELEASE_AGE: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_release_age || 'false' }}
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: bash .github/scripts/resolve-min-release-age.sh

      - uses: ./.github/actions/setup-npm-ci
        with:
          min-release-age-days: ${{ steps.release_age.outputs.days }}

      - run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Resolve min-release-age policy
        id: release_age
        env:
          INPUT_SKIP_RELEASE_AGE: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_release_age || 'false' }}
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: bash .github/scripts/resolve-min-release-age.sh

      - uses: ./.github/actions/setup-npm-ci
        with:
          min-release-age-days: ${{ steps.release_age.outputs.days }}

      - name: Verify Node built-in sqlite (node:sqlite)
        run: node -e "import('node:sqlite').then(()=>console.log('node:sqlite OK')).catch(e=>{console.error(e);process.exit(1)})"
      - name: Check NORTH_TERMS synced with north-reference
        run: |
          OUT=$(node scripts/sync-north-terms-from-reference.mjs)
          echo "$OUT"
          node -e "const j=JSON.parse(process.argv[1]); if(j.new_count>0){console.error('Run: npm run sync:north-terms -- --write'); process.exit(1)}" "$OUT"
      - name: Run tests with coverage (serial — shared SQLite at data/app.sqlite)
        run: npm run test:coverage
        env:
          GEO_ASSERT_ENVELOPE: '1'

      - name: Upload coverage for SonarCloud
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error

  build-client:
    name: Build client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Resolve min-release-age policy
        id: release_age
        env:
          INPUT_SKIP_RELEASE_AGE: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_release_age || 'false' }}
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: bash .github/scripts/resolve-min-release-age.sh

      - uses: ./.github/actions/setup-npm-ci
        with:
          working-directory: client
          min-release-age-days: ${{ steps.release_age.outputs.days }}

      - run: npm run client:build

  build-docs-site:
    name: Build docs site
    runs-on: ubuntu-latest
    needs: sync-main-docs
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Resolve min-release-age policy
        id: release_age
        env:
          INPUT_SKIP_RELEASE_AGE: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_release_age || 'false' }}
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: bash .github/scripts/resolve-min-release-age.sh

      - uses: ./.github/actions/setup-npm-ci
        with:
          working-directory: docs-site
          min-release-age-days: ${{ steps.release_age.outputs.days }}

      - run: npm run gen:api --prefix docs-site
      - run: npm run build --prefix docs-site

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Resolve min-release-age policy
        id: release_age
        env:
          INPUT_SKIP_RELEASE_AGE: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_release_age || 'false' }}
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: bash .github/scripts/resolve-min-release-age.sh

      - uses: ./.github/actions/setup-npm-ci
        with:
          min-release-age-days: ${{ steps.release_age.outputs.days }}

      - run: node scripts/ci-audit.mjs

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Detect SonarCloud configuration
        id: gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          if [ -n "${SONAR_TOKEN}" ] && [ -n "${SONAR_ORGANIZATION}" ] && [ -n "${SONAR_PROJECT_KEY}" ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "run=0" >> "$GITHUB_OUTPUT"
            echo "::notice::SonarCloud skipped (set SONAR_TOKEN, SONAR_ORGANIZATION, and SONAR_PROJECT_KEY to enable)."
          fi

      - uses: actions/checkout@v6
        if: steps.gate.outputs.run == '1'
        with:
          fetch-depth: 0

      - name: Download test coverage
        if: steps.gate.outputs.run == '1'
        uses: actions/download-artifact@v8
        with:
          name: coverage-lcov
          path: coverage

      - name: SonarCloud Scan
        if: steps.gate.outputs.run == '1'
        uses: SonarSource/sonarqube-scan-action@v8.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
