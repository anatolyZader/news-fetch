# SonarCloud — project key and organization are supplied in CI via secrets
# (SONAR_PROJECT_KEY, SONAR_ORGANIZATION). Set the same values in sonarcloud.io.
# GitHub default branch is dev — set SonarCloud main branch to dev (Project Settings → Branches).

sonar.projectName=news

sonar.sources=business_modules,cross-cut-modules,api,utils,scripts,client/src,app.js,server.js
sonar.tests=tests
sonar.test.inclusions=**/*.test.js
sonar.javascript.file.suffixes=.js,.mjs,.cjs,.jsx
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.eslint.reportPaths=eslint-report.json

# Large or generated trees (not application logic)
sonar.exclusions=\
**/node_modules/**,\
**/articles_extracted/**,\
**/reports/**,\
**/signals/**,\
**/docs/product_docs/api/generated/**,\
**/docs/docs-site/**,\
**/client/dist/**,\
**/business_modules/**/data/**,\
**/tests/fixtures/**,\
**/*.md

# Still analyzed for bugs; excluded from coverage metrics only
sonar.coverage.exclusions=\
**/tests/**,\
client/src/**,\
**/input/**,\
**/validation/scripts/**,\
**/tuning/scripts/**,\
**/tuning/golden/buildCorpus.mjs
