# SonarCloud — project key and organization are supplied in CI via secrets
# (SONAR_PROJECT_KEY, SONAR_ORGANIZATION). Set the same values in sonarcloud.io.

sonar.projectName=news

sonar.sources=business_modules,cross-cut-modules,api,utils,shared,app.js,server.js
sonar.tests=tests
sonar.test.inclusions=**/*.test.js
sonar.javascript.file.suffixes=.js,.mjs,.cjs,.jsx
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Large or generated trees (not application logic)
sonar.exclusions=\
**/node_modules/**,\
**/articles_extracted/**,\
**/reports/**,\
**/signals/**,\
**/product_docs/api/generated/**,\
**/docs-site/**,\
**/client/dist/**,\
**/business_modules/**/data/**,\
**/tests/fixtures/**,\
**/*.md,\
**/*.json,\
**/*.yaml,\
**/*.yml,\
**/*.xlsx,\
**/*.txt
