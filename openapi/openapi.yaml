openapi: 3.1.0
info:
  title: VibeSwitch API
  version: 0.1.0
  description: >
    HTTP API for the VibeSwitch backend. This spec is the single source of truth for
    the generated API reference.
servers:
  - url: /
tags:
  - name: Auth
  - name: Reports
  - name: Evidence
  - name: Video
  - name: Education
  - name: Municipalities
  - name: Visits
  - name: Naftali
  - name: Geo
  - name: SocialMedia
  - name: SearchTrends
  - name: Translation
  - name: Chat
  - name: Mailing
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      additionalProperties: true
      properties:
        error: { type: string }
        code: { type: string }
    AuthConfig:
      type: object
      required: [authRequired]
      properties:
        authRequired: { type: boolean }
    EvidenceDraft:
      type: object
      required: [content, updatedAt]
      properties:
        content: { type: string }
        updatedAt: { type: string, nullable: true, description: "ISO timestamp" }
    EvidenceDraftUpdate:
      type: object
      required: [content]
      properties:
        content: { type: string }
    EvidenceSubmitRequest:
      type: object
      required: [content]
      properties:
        content: { type: string }
    EvidenceSubmitResponse:
      type: object
      additionalProperties: true
    ReportTodayResponse:
      type: object
      additionalProperties: true
    TranslateRequest:
      type: object
      required: [report, lang]
      properties:
        report: { type: object, additionalProperties: true }
        lang: { type: string, description: "Target language code" }
    TranslateResponse:
      type: object
      required: [report]
      properties:
        report: { type: object, nullable: true, additionalProperties: true }
    VideoDownloadUrlRequest:
      type: object
      required: [url]
      properties:
        url: { type: string }
    VideoLocalFileRequest:
      type: object
      required: [relativePath]
      properties:
        relativePath: { type: string }
    ChatRequest:
      type: object
      required: [message]
      properties:
        message: { type: string }
        history:
          type: array
          items: { type: object, additionalProperties: true }
    MailConfigResponse:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean, description: "True when RESEND_API_KEY and MAIL_FROM are set and mailing is not disabled" }
    MailProductFlags:
      type: object
      required: [report, naftali, education, platform]
      properties:
        report: { type: boolean }
        naftali: { type: boolean }
        education: { type: boolean }
        platform: { type: boolean }
    MailPreferences:
      type: object
      required: [email, language, products]
      properties:
        email: { type: string }
        language: { type: string, enum: [en, he, ru] }
        products: { $ref: "#/components/schemas/MailProductFlags" }
    MailPreferencesUpdate:
      type: object
      properties:
        email: { type: string }
        language: { type: string, enum: [en, he, ru] }
        products:
          type: object
          additionalProperties: true
    MailSendDigestRequest:
      type: object
      properties:
        to:
          type: string
          description: "Optional; must match JWT email or saved mailing address"
    MailSendDigestResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        id: { type: string, nullable: true, description: "Resend message id when returned" }
    SocialMediaFetchTopicRequest:
      type: object
      required: [topic]
      properties:
        topic:
          type: string
          minLength: 2
          description: Free-text topic or concept to search across platforms
        platforms:
          type: array
          items: { type: string, enum: [x, telegram, facebook] }
          description: Subset of platforms; at least two required when execute is true
        execute:
          type: boolean
          default: false
          description: When false, returns dry-run estimate only
        maxCostUsd:
          type: number
          description: Optional cost cap for live fetch
        maxPerQuery:
          type: integer
          description: Optional per-query result cap
        lang:
          type: string
          description: Optional UI language for post translation (e.g. en, he, ru)
    SocialMediaTopicFetchHistoryResponse:
      type: object
      required: [searches]
      properties:
        searches:
          type: array
          items: { type: object, additionalProperties: true }
    SearchTrendsDistrictsResponse:
      type: object
      required: [districts]
      properties:
        districts:
          type: array
          items:
            type: object
            required: [id, geo, labelKey]
            properties:
              id: { type: string, description: "District id (national, north, south, …)" }
              geo: { type: string, description: "Google Trends geo code" }
              labelKey: { type: string }
    SearchTrendsTopicGroupsResponse:
      type: object
      required: [topicGroups]
      properties:
        topicGroups:
          type: array
          items: { type: object, additionalProperties: true }
paths:
  /api/auth/config:
    get:
      tags: [Auth]
      security: []
      summary: Discover auth requirements for this deployment.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthConfig" }

  /api/report/today:
    get:
      tags: [Reports]
      summary: Fetch today's cached report (if any).
      parameters:
        - in: query
          name: scope
          required: false
          schema:
            type: string
            enum: [national, north]
          description: Report scope to fetch. Defaults to national.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportTodayResponse" }
        "401":
          description: Unauthorized (when auth is required)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/evidence-draft:
    get:
      tags: [Evidence]
      summary: Get the current evidence draft.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [content, updatedAt]
                properties:
                  content: { type: string }
                  updatedAt: { type: string, nullable: true }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      tags: [Evidence]
      summary: Update the current evidence draft.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvidenceDraftUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidenceDraft" }
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/evidence-submit:
    post:
      tags: [Evidence]
      summary: Submit evidence for ingestion/analysis.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvidenceSubmitRequest" }
      responses:
        "202":
          description: Accepted (queued)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidenceSubmitResponse" }
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/evidence-submissions:
    get:
      tags: [Evidence]
      summary: List recent evidence submissions.
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/evidence-submissions/latest:
    get:
      tags: [Evidence]
      summary: Get the latest submission (if any).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/evidence-submissions/{id}:
    get:
      tags: [Evidence]
      summary: Get a submission by id.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Invalid id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/video/download-url:
    post:
      tags: [Video]
      summary: Download a video from a URL and return its local path.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoDownloadUrlRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: Upstream failure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/video/local-file:
    post:
      tags: [Video]
      summary: Resolve a local video file path.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoLocalFileRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/education-sessions:
    get:
      tags: [Education]
      summary: Get education sessions dashboard.
      parameters:
        - in: query
          name: refresh
          schema: { type: string, enum: ["0", "1"] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "502":
          description: Upstream failure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/municipalities:
    get:
      tags: [Municipalities]
      summary: Get municipality dashboard.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "502":
          description: Upstream failure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/visits:
    get:
      tags: [Visits]
      summary: Get professional squad visits dashboard.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "502":
          description: Upstream failure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/naftali:
    get:
      tags: [Naftali]
      summary: Get Naftali dashboard.
      parameters:
        - in: query
          name: refresh
          schema: { type: string, enum: ["0", "1"] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "502":
          description: Upstream failure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/social-media:
    get:
      tags: [SocialMedia]
      summary: Social OSINT dashboard — available bundle dates and counts.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "502":
          description: Upstream failure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Social media service not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/social-media/platforms:
    get:
      tags: [SocialMedia]
      summary: Selectable platforms for topic fetch (X, Telegram, Facebook).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "503":
          description: Social media service not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/social-media/daily:
    get:
      tags: [SocialMedia]
      summary: Daily OSINT feed — findings grouped by emergency category.
      parameters:
        - in: query
          name: date
          required: true
          schema: { type: string, format: date }
          description: Bundle date (YYYY-MM-DD)
        - in: query
          name: category
          schema: { type: string }
          description: Optional emergency category id filter
        - in: query
          name: lang
          schema: { type: string }
          description: Optional UI language for post translation
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400":
          description: Missing or invalid date
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Daily feed not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: Upstream failure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Social media service not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/social-media/fetch-topic:
    post:
      tags: [SocialMedia]
      summary: On-demand topic search across social platforms.
      description: >
        Dry-run by default (`execute: false`). When `execute` is true, at least two
        platforms must be selected. Results may be persisted for history retrieval.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SocialMediaFetchTopicRequest" }
      responses:
        "200":
          description: Topic fetch result (dry-run estimate or live posts)
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400":
          description: Invalid topic or platform selection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: Upstream failure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Social media service not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/social-media/topic-fetches:
    get:
      tags: [SocialMedia]
      summary: List recent on-demand topic searches.
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialMediaTopicFetchHistoryResponse" }
        "502":
          description: Upstream failure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Social media service not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/social-media/topic-fetches/{id}:
    get:
      tags: [SocialMedia]
      summary: Load a saved topic fetch by id.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: lang
          schema: { type: string }
          description: Optional UI language for post translation
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "404":
          description: Topic fetch not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: Upstream failure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Social media service not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/social-media/report:
    get:
      tags: [SocialMedia]
      summary: OSINT bundle and markdown report for a date.
      parameters:
        - in: query
          name: date
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400":
          description: Missing or invalid date
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Report not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: Upstream failure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Social media service not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/search-trends/districts:
    get:
      tags: [SearchTrends]
      summary: Israel district list for trends dashboards.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchTrendsDistrictsResponse" }
        "503":
          description: Search trends service not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/search-trends/topic-groups:
    get:
      tags: [SearchTrends]
      summary: Topic group metadata for the Trends tab filters.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchTrendsTopicGroupsResponse" }
        "503":
          description: Search trends service not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/search-trends/dashboard:
    get:
      tags: [SearchTrends]
      summary: Search interest dashboard for a district and time window.
      description: >
        Returns cached data when fresh (6h TTL) unless `refresh=1`. Falls back to
        stale cache or demo data when live fetch is unavailable (`TRENDS_DEMO_MODE=1`).
      parameters:
        - in: query
          name: district
          schema: { type: string, default: national }
          description: District id (alias query param `scope`)
        - in: query
          name: scope
          schema: { type: string }
          description: Same as `district` when preferred
        - in: query
          name: days
          schema: { type: integer, enum: [1, 3, 7], default: 7 }
          description: Time window in days
        - in: query
          name: refresh
          schema: { type: string, enum: ["0", "1", "true", "false"] }
          description: Force live fetch when `1` or `true`
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "502":
          description: Upstream failure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Search trends service not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/geo/resolve:
    get:
      tags: [Geo]
      summary: Resolve a locality name to deterministic geo envelope (internal).
      parameters:
        - in: query
          name: name
          schema: { type: string }
          description: Locality name (Hebrew or English). Alias query param `q`.
        - in: query
          name: q
          schema: { type: string }
          description: Same as `name` when preferred.
      responses:
        "200":
          description: Geo envelope (resolved or unknown)
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400":
          description: Missing name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Geo service unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/translate:
    post:
      tags: [Translation]
      summary: Translate an assessment to a target language (when enabled).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TranslateRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TranslateResponse" }
        "502":
          description: Translation failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/mail/config:
    get:
      tags: [Mailing]
      summary: Mailing feature availability
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailConfigResponse" }

  /api/mail/preferences:
    get:
      tags: [Mailing]
      summary: Get saved mailing preferences for the signed-in user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailPreferences" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      tags: [Mailing]
      summary: Update mailing preferences
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MailPreferencesUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailPreferences" }
        "400":
          description: Invalid email
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/mail/send-digest:
    post:
      tags: [Mailing]
      summary: Send one digest email now (Resend)
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MailSendDigestRequest" }
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailSendDigestResponse" }
        "400":
          description: Bad request (no destination or invalid to)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: Provider error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Mailing not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/chat:
    post:
      tags: [Chat]
      summary: Chat with the system (Server-Sent Events).
      description: Returns `text/event-stream` events.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatRequest" }
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

